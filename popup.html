<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Lock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      overflow: hidden;
    }

    .popup-container {
      padding: 20px;
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 2.5rem;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .status-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    .status-locked {
      background: #ff4757;
    }

    .status-unlocked {
      background: #2ed573;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .input-group {
      margin-bottom: 15px;
      position: relative;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .password-input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .password-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .password-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.2);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn-primary:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 71, 87, 0.8);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255, 71, 87, 1);
      transform: translateY(-1px);
    }

    .btn-settings {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 12px;
      padding: 8px 12px;
    }

    .btn-settings:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .error-message {
      background: rgba(255, 71, 87, 0.2);
      border: 1px solid rgba(255, 71, 87, 0.5);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .success-message {
      background: rgba(46, 213, 115, 0.2);
      border: 1px solid rgba(46, 213, 115, 0.5);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
    }

    .attempts-warning {
      background: rgba(255, 193, 7, 0.2);
      border: 1px solid rgba(255, 193, 7, 0.5);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .version {
      font-size: 0.75rem;
      opacity: 0.6;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">🔒</div>
      <div class="title">Chrome Lock</div>
      <div class="subtitle">Bảo vệ trình duyệt của bạn</div>
    </div>

    <div class="status-section">
      <div class="status-indicator">
        <div id="statusDot" class="status-dot status-locked"></div>
        <span id="statusText">Trình duyệt đang bị khóa</span>
      </div>
      <div id="lockoutInfo" class="hidden" style="font-size: 0.8rem; opacity: 0.8;"></div>
    </div>

    <div id="unlockSection">
      <div class="input-group">
        <label class="input-label" for="password">Mật khẩu</label>
        <input 
          type="password" 
          id="password" 
          class="password-input"
          placeholder="Nhập mật khẩu để mở khóa..." 
          autofocus
        />
      </div>

      <div class="button-group">
        <button id="unlockBtn" class="btn btn-primary">
          🔓 Mở Khóa
        </button>
        <button id="lockBtn" class="btn btn-secondary">
          🔒 Khóa Ngay
        </button>
        <button id="settingsBtn" class="btn btn-settings">
          ⚙️ Cài Đặt
        </button>
      </div>
    </div>

    <div id="messageArea"></div>

    <div class="footer">
      <div class="version">v2.0 - Enhanced Security</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
